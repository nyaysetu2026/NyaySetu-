openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NyaySetu Legal Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gemini
    description: Gemini AI chat and image operations
  - name: lawyers
    description: Lawyer directory operations
  - name: documents
    description: Legal document templates
  - name: articles
    description: Know Your Rights articles
  - name: cases
    description: Legal case tracking
  - name: emergency
    description: Emergency legal contacts
  - name: stats
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Gemini AI Chat
  /gemini/conversations:
    get:
      operationId: listGeminiConversations
      tags: [gemini]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiConversation"
    post:
      operationId: createGeminiConversation
      tags: [gemini]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversation"
  /gemini/conversations/{id}:
    get:
      operationId: getGeminiConversation
      tags: [gemini]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteGeminiConversation
      tags: [gemini]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /gemini/conversations/{id}/messages:
    get:
      operationId: listGeminiMessages
      tags: [gemini]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiMessage"
    post:
      operationId: sendGeminiMessage
      tags: [gemini]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  # Lawyers Directory
  /lawyers:
    get:
      operationId: listLawyers
      tags: [lawyers]
      summary: List lawyers with optional search/filter
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: specialization
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of lawyers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lawyer"
  /lawyers/{id}:
    get:
      operationId: getLawyer
      tags: [lawyers]
      summary: Get lawyer details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lawyer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lawyer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # Legal Document Templates
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List legal document templates
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalDocument"
  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get document template details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # Know Your Rights Articles
  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List Know Your Rights articles
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
  /articles/{id}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get article details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # Case Tracker
  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List legal cases
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalCase"
    post:
      operationId: createCase
      tags: [cases]
      summary: Create a new case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalCaseInput"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCase"
  /cases/{id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get case details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Case details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCase"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Update case status or details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalCaseUpdate"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCase"
    delete:
      operationId: deleteCase
      tags: [cases]
      summary: Delete a case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Emergency Contacts
  /emergency-contacts:
    get:
      operationId: listEmergencyContacts
      tags: [emergency]
      summary: List emergency legal contacts
      responses:
        "200":
          description: List of emergency contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmergencyContact"

  # Dashboard Stats
  /stats:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get platform dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # Gemini schemas
    GeminiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    GeminiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    GeminiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    GeminiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    GeminiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/GeminiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    # Lawyer schemas
    Lawyer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        specialization:
          type: string
        city:
          type: string
        state:
          type: string
        experience:
          type: integer
        rating:
          type: number
        reviewCount:
          type: integer
        languages:
          type: array
          items:
            type: string
        phone:
          type: string
        email:
          type: string
        barCouncilId:
          type: string
        bio:
          type: string
        fee:
          type: integer
        available:
          type: boolean
        imageUrl:
          type: ["string", "null"]
      required:
        - id
        - name
        - specialization
        - city
        - state
        - experience
        - rating
        - reviewCount
        - languages
        - phone
        - email
        - barCouncilId
        - bio
        - fee
        - available

    # Legal Document schemas
    LegalDocument:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
        description:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        language:
          type: string
        downloadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - category
        - description
        - content
        - tags
        - language
        - downloadCount
        - createdAt

    # Article schemas
    Article:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
        summary:
          type: string
        content:
          type: string
        language:
          type: string
        readTime:
          type: integer
        viewCount:
          type: integer
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - category
        - summary
        - content
        - language
        - readTime
        - viewCount
        - tags
        - createdAt

    # Case schemas
    LegalCase:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
        caseNumber:
          type: ["string", "null"]
        court:
          type: ["string", "null"]
        nextHearingDate:
          type: ["string", "null"]
        lawyerName:
          type: ["string", "null"]
        category:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - status
        - category
        - createdAt
        - updatedAt
    LegalCaseInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
        caseNumber:
          type: string
        court:
          type: string
        nextHearingDate:
          type: string
        lawyerName:
          type: string
        category:
          type: string
        notes:
          type: string
      required:
        - title
        - description
        - status
        - category
    LegalCaseUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
        caseNumber:
          type: string
        court:
          type: string
        nextHearingDate:
          type: string
        lawyerName:
          type: string
        notes:
          type: string

    # Emergency Contact schemas
    EmergencyContact:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        phone:
          type: string
        available247:
          type: boolean
        category:
          type: string
      required:
        - id
        - name
        - description
        - phone
        - available247
        - category

    # Dashboard Stats schema
    DashboardStats:
      type: object
      properties:
        totalLawyers:
          type: integer
        totalDocuments:
          type: integer
        totalArticles:
          type: integer
        totalCases:
          type: integer
        activeCases:
          type: integer
        citiesServed:
          type: integer
        languagesSupported:
          type: integer
        aiConversations:
          type: integer
      required:
        - totalLawyers
        - totalDocuments
        - totalArticles
        - totalCases
        - activeCases
        - citiesServed
        - languagesSupported
        - aiConversations
